name: Import CodeCafe Lab Records v0.6.11 baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified Lab Records source
        shell: bash
        run: |
          set -euo pipefail
          for chunk in .bootstrap/lab.*; do
            tr -d '\n\r' < "$chunk"
          done | base64 --decode > /tmp/codecafe-lab-records.tar.xz
          echo 'c13ead442c0df91921797d9f6526a80fe5702a05a96e5d938662d825d177a232  /tmp/codecafe-lab-records.tar.xz' | sha256sum -c -
          tar -xJf /tmp/codecafe-lab-records.tar.xz -C .

      - name: Restore exact OCR language models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocr/tessdata
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata \
            --output ocr/tessdata/eng.traineddata
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/spa.traineddata \
            --output ocr/tessdata/spa.traineddata
          echo '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  ocr/tessdata/eng.traineddata' | sha256sum -c -
          echo '6f2e04d02774a18f01bed44b1111f2cd7f3ba7ac9dc4373cd3f898a40ea6b464  ocr/tessdata/spa.traineddata' | sha256sum -c -

      - name: Validate imported source
        shell: bash
        run: |
          set -euo pipefail
          ./validate_source.sh
          test -f static/app.js
          test -f static/main.css
          test -f templates/index.html
          test -f ocr/tessdata/eng.traineddata
          test -f ocr/tessdata/spa.traineddata

      - name: Commit Lab Records baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'Jaime Sanchez'
          git config user.email '34150357+looplogic-dot-tech@users.noreply.github.com'
          git add -A
          git commit -m 'Import CodeCafe Lab Records v0.6.11 stable baseline'
          git push origin main
